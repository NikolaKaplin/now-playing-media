# Fork of nowplaying 0.1.1 (MIT, https://crates.io/crates/nowplaying), whose
# repository is gone. The macOS backend is replaced: MediaRemote is read through
# the bundled mediaremote-adapter, which keeps working on macOS 15.4+.
[package]
name = "nowplaying"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Cross-platform system media session library for Rust"
publish = false

[dependencies]
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1.53.1", features = ["process"] }
