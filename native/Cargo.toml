[workspace]
members = ["media"]

[package]
name = "now-playing-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
nowplaying = { path = "media" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
napi-build = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
